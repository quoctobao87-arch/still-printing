<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tính giá in decal — Konica | Still Printing</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--surface-0:#faf9f7;--surface-1:#f1efe8;--surface-2:#ffffff;--border:#dcdad2;--border-strong:#b4b2a9;--border-accent:#378ADD;--text-primary:#2c2c2a;--text-secondary:#5f5e5a;--text-muted:#888780;--bg-success:#E1F5EE;--text-success:#0F6E56;--bg-danger:#FCEBEB;--text-danger:#A32D2D;--bg-warning:#FAEEDA;--text-warning:#854F0B;--radius:8px;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--surface-0);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:920px;margin:0 auto}
h1{font-size:22px;font-weight:500;margin:0 0 4px}
.sub{color:var(--text-secondary);font-size:13px;margin-bottom:20px}
input,select,textarea,button{font-family:inherit;font-size:14px;color:var(--text-primary);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px}
input,select{height:36px}
textarea{padding:10px}
button{cursor:pointer;border-color:var(--border-strong);background:transparent}
button:hover{background:var(--surface-1)}
label{display:block;margin-bottom:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
<h1>Tính giá in decal — Konica</h1>
<div class="sub">Still Printing · bình file, giá vốn, giá bán 2 tầng, tin gửi khách &amp; lệnh gửi xưởng</div>
<div id="app"></div>
</div>
<script>
document.getElementById('app').innerHTML = `
<div id="mode" style="display:flex;gap:8px;margin-bottom:1.25rem">
<button data-m="0" style="font-size:13px"><i class="ti ti-tag" style="font-size:15px;vertical-align:-2px"></i> In 1 loại tem</button>
<button data-m="1" style="font-size:13px"><i class="ti ti-layers-subtract" style="font-size:15px;vertical-align:-2px"></i> In theo bộ (đồng bộ)</button>
</div>
<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">Thông tin đơn hàng</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:1.25rem">
<div><label style="font-size:13px;color:var(--text-secondary)">Khách hàng</label><input id="cust" value="" placeholder="tên khách" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary)" id="qlab">Số tem cần in</label><input type="number" id="sets" value="700" style="width:100%"></div>
</div>
<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px" id="tlab">Kích thước tem (cm)</div>
<div id="rows" style="margin-bottom:1.25rem"></div>
<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">Khổ decal (cm) — luôn đứng, không xoay</div>
<div id="chips" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem"></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:12px;margin-bottom:1rem">
<div><label style="font-size:13px;color:var(--text-secondary)">Rộng (cm)</label><input type="number" id="sw" value="33" step="0.1" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary)">Cao (cm)</label><input type="number" id="sh" value="48" step="0.1" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary)">Cách tem (cm)</label><input type="number" id="gp" value="0.4" step="0.1" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary)">Lề trên (cm)</label><input type="number" id="mt" value="3" step="0.1" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary)">Lề dưới (cm)</label><input type="number" id="mb" value="1.25" step="0.05" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary)">Lề trái (cm)</label><input type="number" id="ml" value="0.5" step="0.1" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary)">Lề phải (cm)</label><input type="number" id="mr" value="0.5" step="0.1" style="width:100%"></div>
</div>
<div id="mchips" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem"></div>
<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">Vật tư &amp; chi phí</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:1rem">
<div><label style="font-size:13px;color:var(--text-secondary)">Loại decal</label><select id="dc" style="width:100%"></select></div>
<div><label style="font-size:13px;color:var(--text-secondary)">Màng</label><select id="mg" style="width:100%"><option value="">Không cán màng</option><option value="bong">Màng bóng</option><option value="mo" selected>Màng mờ</option></select></div>
<div><label style="font-size:13px;color:var(--text-secondary)">Tiền công (đ/giờ)</label><input type="number" id="cgh" value="40000" step="1000" style="width:100%"></div>
<div style="background:#E6F1FB;border-radius:var(--radius);padding:6px 8px"><label style="font-size:13px;color:#185FA5;font-weight:500">Số giờ</label><input type="number" id="gio" value="1" step="0.5" style="width:100%;border-color:#378ADD;color:#042C53"></div>
<div><label style="font-size:13px;color:var(--text-secondary)">Ép kim (đ/tờ)</label><input type="number" id="ek" value="0" step="100" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary)">Khấu hao (%)</label><input type="number" id="kh" value="10" step="1" style="width:100%"></div>
</div>
<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">Markup, điều khoản &amp; ngày hẹn</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:1.25rem">
<div><label style="font-size:13px;color:var(--text-secondary)">Markup Hữu Tín (%)</label><input type="number" id="mk1" value="50" step="5" style="width:100%"></div>
<div style="background:#E6F1FB;border-radius:var(--radius);padding:6px 8px"><label style="font-size:13px;color:#185FA5;font-weight:500">Markup Still (%)</label><input type="number" id="mk2" value="30" step="5" style="width:100%;border-color:#378ADD;color:#042C53"></div>
<div><label style="font-size:13px;color:var(--text-secondary)">Làm tròn lên (đ)</label><input type="number" id="lt" value="10" step="10" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary)">VAT (%)</label><input type="number" id="vat" value="0" step="1" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary)">Cọc (%)</label><input type="number" id="coc" value="50" step="5" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary)" id="glab">Giá Still báo khách (tuỳ chọn)</label><input type="number" id="gb" value="" step="10" placeholder="để trống = theo markup" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary)">Ngày hẹn (số ngày)</label><input id="ngay" value="" placeholder="VD: 05" style="width:100%"></div>
</div>
</div>
<div id="order" style="display:grid;gap:12px;margin-bottom:1.25rem"></div>
<div id="chk" style="margin-bottom:1.25rem"></div>
<div id="best" style="background:var(--bg-success);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--text-success);margin-bottom:1.25rem"></div>
<div id="sale" style="margin-bottom:1.25rem"></div>
<div id="strat" style="display:grid;gap:10px;margin-bottom:1.25rem"></div>
<div id="detail" style="font-size:14px;color:var(--text-secondary);margin-bottom:1rem"></div>
<div id="break" style="margin-bottom:1.25rem"></div>
<div id="prev" style="background:var(--surface-1);border-radius:12px;padding:1rem;display:flex;justify-content:center;gap:16px;margin-bottom:1.25rem"></div>
<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">So sánh 3 khổ × 2 phương án lề — theo tổng giá vốn</div>
<div id="cmp" style="display:grid;gap:10px"></div>
`;
(function(){
var RAMP=[{f:'#9FE1CB',s:'#0F6E56'},{f:'#CECBF6',s:'#534AB7'},{f:'#F5C4B3',s:'#993C1D'},{f:'#FAC775',s:'#854F0B'}];
var SIZES=[{w:33,h:35,t:'Ưu tiên 1',c:561},{w:33,h:48,t:'Ưu tiên 2',c:1122},{w:32.5,h:43,t:'Ưu tiên 3',c:1122}];
var DECAL=[
 {n:'Decal giấy',k:'giay',p:[1495,2040,1830]},
 {n:'Decal giấy vàng xanh',k:'giay',p:[1238,1652,1457]},
 {n:'Decal giấy vàng đỏ',k:'giay',p:[null,1880,1644]},
 {n:'Decal giấy da bò',k:'giay',p:[1380,2006,null]},
 {n:'Decal nhựa',k:'nhua',p:[2360,2943,2643]},
 {n:'Decal trong',k:'nhua',p:[2424,null,null]}
];
var MANG={giay:{bong:[197,270,238],mo:[203,278,245]},nhua:{bong:[462,634,559],mo:[578,792,699]}};
var MARG=[{n:'Lề A',t:3,b:1.25,l:1,r:1},{n:'Lề B',t:3,b:1.25,l:0.5,r:0.5}];
var BANK='Thông tin chuyển khoản:\nChủ tài khoản: Hộ Kinh Doanh MCM\nNgân hàng Quân Đội: MB Bank\nSố tài khoản: 6986417373';
var M=0,PICK=null;
var one=[{n:'Tem',w:9,h:5,p:1}];
var setT=[{n:'Mặt trước',w:12,h:7,p:1},{n:'Mặt sau',w:7,h:7,p:1}];
function T(){return M?setT:one}
function TS(){return T().filter(function(t){return t.w>0&&t.h>0&&(!M||t.p>0)}).map(function(t){return {n:t.n,w:t.w*10,h:t.h*10,p:t.p}});}
var rowsEl=document.getElementById('rows');
function v(id){return +document.getElementById(id).value||0}
function raw(id){return document.getElementById(id).value.trim()}
function curM(){return {t:v('mt'),b:v('mb'),l:v('ml'),r:v('mr')}}
function fm(x){return (Math.round(x*100)/100).toString().replace('.',',')}
function money(x){return Math.round(x).toLocaleString('vi-VN')+'đ'}
function dsel(){return DECAL[+document.getElementById('dc').value||0]}
function mname(){var m=document.getElementById('mg').value;return m==='bong'?'Màng bóng':(m==='mo'?'Màng mờ':'Không cán màng');}
function cong(){return v('cgh')*v('gio')}
function unit(zi){
 var d=dsel(),mn=document.getElementById('mg').value,dp=d.p[zi];
 if(dp===null||dp===undefined)return null;
 var mp=mn?(MANG[d.k][mn]||[])[zi]:0;
 if(mp===null||mp===undefined)return null;
 return SIZES[zi].c+dp+mp+v('ek');
}
function total(zi,sheets){var u=unit(zi);if(u===null||!isFinite(sheets))return Infinity;return (sheets*u+cong())*(1+v('kh')/100);}
function zIdx(){var w=v('sw'),h=v('sh');for(var i=0;i<SIZES.length;i++)if(Math.abs(SIZES[i].w-w)<0.001&&Math.abs(SIZES[i].h-h)<0.001)return i;return -1;}
function initSel(){document.getElementById('dc').innerHTML=DECAL.map(function(d,i){return '<option value="'+i+'">'+d.n+'</option>'}).join('');document.getElementById('dc').value='4';}
function pcalc(cost,Q){
 var m1=v('mk1'),m2=v('mk2'),lt=v('lt')||1,manual=raw('gb');
 var uCost=cost/Q,uAgent=Math.ceil(uCost*(1+m1/100)/lt)*lt;
 var uSell=manual!==''?+manual:Math.ceil(uAgent*(1+m2/100)/lt)*lt;
 return {uCost:uCost,uAgent:uAgent,uSell:uSell,agentRev:uAgent*Q,sellRev:uSell*Q,pHT:uAgent*Q-cost,pST:(uSell-uAgent)*Q};
}
function chips(){
 document.getElementById('chips').innerHTML=SIZES.map(function(s,i){var on=zIdx()===i,u=unit(i);
  return '<button data-s="'+i+'" style="'+(on?'border:2px solid var(--border-accent);':'')+'font-size:13px">'+fm(s.w)+' × '+fm(s.h)+' cm<span style="color:var(--text-muted);margin-left:6px">'+(u===null?'không có vật tư':money(u)+'/tờ')+'</span></button>';}).join('');
 var c=curM();
 document.getElementById('mchips').innerHTML=MARG.map(function(m,i){var on=c.t===m.t&&c.b===m.b&&c.l===m.l&&c.r===m.r;return '<button data-g="'+i+'" style="'+(on?'border:2px solid var(--border-accent);':'')+'font-size:13px">'+m.n+'<span style="color:var(--text-muted);margin-left:6px">'+fm(m.t)+' / '+fm(m.b)+' / '+fm(m.l)+' / '+fm(m.r)+' cm</span></button>';}).join('');
}
function modeUI(){
 var bs=document.querySelectorAll('#mode button');
 for(var i=0;i<bs.length;i++)bs[i].style.border=(+bs[i].dataset.m===M)?'2px solid var(--border-accent)':'1px solid var(--border-strong)';
 document.getElementById('qlab').textContent=M?'Số bộ cần in':'Số tem cần in';
 document.getElementById('tlab').textContent=M?'Các loại tem trong 1 bộ (cm)':'Kích thước tem (cm)';
 document.getElementById('glab').textContent=M?'Giá Still báo khách (đ/bộ)':'Giá Still báo khách (đ/tem)';
}
function render(){
 var ts=T(),g='grid-template-columns:14px 1.4fr 1fr 1fr '+(M?'1fr ':'')+'32px;gap:8px';
 rowsEl.innerHTML='<div style="display:grid;'+g+';font-size:12px;color:var(--text-muted);margin-bottom:4px"><span></span><span>tên</span><span>rộng (cm)</span><span>cao (cm)</span>'+(M?'<span>con / bộ</span>':'')+'<span></span></div>'+
 ts.map(function(t,i){return '<div style="display:grid;'+g+';align-items:center;margin-bottom:8px">'+
 '<span style="width:12px;height:12px;border-radius:3px;background:'+RAMP[i%4].f+';border:1px solid '+RAMP[i%4].s+'"></span>'+
 '<input value="'+t.n+'" data-k="n" data-i="'+i+'" style="width:100%">'+
 '<input type="number" step="0.1" value="'+t.w+'" data-k="w" data-i="'+i+'" style="width:100%">'+
 '<input type="number" step="0.1" value="'+t.h+'" data-k="h" data-i="'+i+'" style="width:100%">'+
 (M?'<input type="number" value="'+t.p+'" data-k="p" data-i="'+i+'" style="width:100%">':'')+
 (M&&ts.length>1?'<button data-del="'+i+'" style="padding:0 8px"><i class="ti ti-x"></i></button>':'<span></span>')+'</div>';}).join('')+
 (M?'<button id="add" style="margin-top:2px"><i class="ti ti-plus" style="font-size:15px;vertical-align:-2px"></i> Thêm loại tem</button>':'');
}
function tenTem(){var a=T().map(function(t){return t.n}).filter(function(x){return x});return a.join(' + ');}
function kt(){return T().map(function(t){return (M?t.n+' ':'')+fm(t.w)+' x '+fm(t.h)+' cm'}).join(M?' | ':'');}
function slText(){
 var Q=v('sets'),ts=T(),s=Q+(M?' bộ':' tem');
 if(M)s+=' ('+ts.map(function(t){return t.n+' '+Q*t.p+' con'}).join(', ')+')';
 return s;
}
function textKhach(pc){
 var dv=M?'bộ':'tem',vat=v('vat'),coc=v('coc'),nd=raw('ngay');
 var s='Em gửi thông tin đơn hàng của mình như sau:\n\n'+
 'Khách hàng: '+raw('cust')+'\n'+
 'Tên tem: '+tenTem()+'\n'+
 'Loại decal: '+dsel().n+'\n'+
 'Cán màng: '+mname()+'\n'+
 'Bế demi\n'+
 'Kích thước: '+kt()+'\n'+
 'Số lượng: '+slText()+'\n';
 if(pc){
  var tt=pc.sellRev*(1+vat/100);
  s+='Đơn giá: '+money(pc.uSell)+'/'+dv+'\n'+
  'Thành tiền: '+money(tt)+(vat?' (đã gồm VAT '+vat+'%)':' (chưa gồm VAT)')+'\n'+
  'Cọc '+coc+'% đơn hàng: '+money(tt*coc/100)+'\n';
 }
 s+='Ngày hẹn: '+nd+' ngày kể từ khi nhận được thanh toán cọc.\n\n'+
 'Cảm ơn anh/chị đã xem qua, nếu anh/chị duyệt báo giá, vui lòng chuyển khoản cọc để bên em tiến hành in ấn ạ\n\n'+BANK;
 return s;
}
function textXuong(sheets,per){
 return 'Khách hàng: '+raw('cust')+'\n'+
 'Tên tem: '+tenTem()+'\n'+
 'Loại decal: '+dsel().n+'\n'+
 'Cán màng: '+mname()+'\n'+
 'Bế demi\n'+
 'Kích thước: '+kt()+'\n'+
 'Số lượng: '+slText()+'\n'+
 'Khổ decal in: '+fm(v('sw'))+' x '+fm(v('sh'))+' cm\n'+
 'Số tờ cần in: '+(sheets||'—')+' tờ ('+(per?fm(per)+(M?' bộ':' tem')+'/tờ':'—')+')\n'+
 'Ngày hẹn: '+raw('ngay')+' ngày';
}
function box(id,title,icon,bg,bd,fg,txt){
 return '<div style="background:'+bg+';border:1px solid '+bd+';border-radius:12px;padding:14px">'+
 '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'+
 '<div style="font-size:15px;font-weight:500;color:'+fg+'"><i class="ti '+icon+'" style="font-size:17px;vertical-align:-3px;margin-right:6px"></i>'+title+'</div>'+
 '<button data-cp="'+id+'" style="font-size:13px;border-color:'+bd+';color:'+fg+'"><i class="ti ti-copy" style="font-size:15px;vertical-align:-2px"></i> Copy</button></div>'+
 '<textarea id="'+id+'" rows="'+(txt.split('\n').length+1)+'" style="width:100%;font-family:var(--font-mono);font-size:13px;line-height:1.6;border-color:'+bd+'"></textarea></div>';
}
function orderBoxes(sheets,per,pc){
 var el=document.getElementById('order');
 var tk=textKhach(pc),tx=textXuong(sheets,per);
 el.innerHTML=box('otk','Tin gửi KHÁCH — có giá, không có số tờ','ti-user','#E1F5EE','#5DCAA5','#0F6E56',tk)+
 box('otx','Lệnh gửi XƯỞNG — có số tờ, không có giá','ti-building-factory','#FAEEDA','#EF9F27','#854F0B',tx);
 document.getElementById('otk').value=tk;
 document.getElementById('otx').value=tx;
 var bs=el.querySelectorAll('[data-cp]');
 for(var i=0;i<bs.length;i++)(function(b){
  b.addEventListener('click',function(){
   var t=document.getElementById(b.dataset.cp);t.select();
   try{document.execCommand('copy');}catch(e){}
   if(navigator.clipboard)navigator.clipboard.writeText(t.value).catch(function(){});
   b.textContent='Đã copy';setTimeout(function(){b.innerHTML='<i class="ti ti-copy" style="font-size:15px;vertical-align:-2px"></i> Copy';},1500);
  });
 })(bs[i]);
}
function checkBox(items){
 var bad=items.filter(function(i){return !i.ok}).length;
 document.getElementById('chk').innerHTML='<div style="background:'+(bad?'var(--bg-danger)':'var(--surface-1)')+';border-radius:var(--radius);padding:12px 14px">'+
 '<div style="font-size:13px;font-weight:500;margin-bottom:8px;color:'+(bad?'var(--text-danger)':'var(--text-secondary)')+'">'+(bad?'Có '+bad+' mục cần xem lại':'Đã kiểm tra — tất cả khớp')+'</div>'+
 '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px">'+
 items.map(function(i){return '<div style="font-size:13px;color:'+(i.ok?'var(--text-secondary)':'var(--text-danger)')+'"><i class="ti '+(i.ok?'ti-check':'ti-alert-triangle')+'" style="font-size:15px;vertical-align:-2px;margin-right:6px"></i>'+i.n+'</div>'}).join('')+'</div></div>';
}
function grid(x,y,w,h,tw,th,g,idx){var c=Math.floor((w+g)/(tw+g)),r=Math.floor((h+g)/(th+g));if(c<1||r<1)return{n:0,rects:[],c:0,r:0};var o=[];for(var i=0;i<c;i++)for(var j=0;j<r;j++)o.push({x:x+i*(tw+g),y:y+j*(th+g),w:tw,h:th,i:idx||0});return{n:c*r,rects:o,c:c,r:r};}
function packOne(W,H,a,b,g,idx){
 var best={n:0,rects:[]};
 if(W<=0||H<=0)return best;
 function t(tw,th){var s=grid(0,0,W,H,tw,th,g,idx);if(s.n>best.n)best={n:s.n,rects:s.rects};}
 t(a,b);t(b,a);
 [[a,b,b,a],[b,a,a,b]].forEach(function(o){
  var m=grid(0,0,W,H,o[0],o[1],g,idx);if(!m.n)return;
  var uW=m.c*(o[0]+g)-g,rW=W-uW-g,s1=rW>0?grid(uW+g,0,rW,H,o[2],o[3],g,idx):{n:0,rects:[]};
  if(m.n+s1.n>best.n)best={n:m.n+s1.n,rects:m.rects.concat(s1.rects)};

 var bc=Math.min.apply(null,all.map(function(o){return o.ct})),bw=all.filter(function(o){return o.ct===bc})[0];
 document.getElementById('best').innerHTML=isFinite(bc)?'<i class="ti ti-coin" style="font-size:16px;vertical-align:-3px;margin-right:6px"></i>Rẻ nhất: khổ '+fm(SIZES[bw.zi].w)+' × '+fm(SIZES[bw.zi].h)+' cm, '+MARG[bw.mi].n+', '+bw.lb+' — '+bw.sh+' tờ, giá vốn '+money(bc)+' ('+money(bc/bw.sh)+'/tờ · '+money(bc/Q)+'/'+(M?'bộ':'tem')+')':'Chưa có phương án nào vừa khổ, hoặc loại decal này không có khổ đó.';
 document.getElementById('cmp').innerHTML=SIZES.map(function(z,zj){
  var u=unit(zj);
  return '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px">'+
  '<div style="font-size:13px;font-weight:500;margin-bottom:8px">'+fm(z.w)+' × '+fm(z.h)+' cm <span style="color:var(--text-muted);font-weight:400">'+z.t+' · '+(u===null?'loại decal/màng này không có khổ đó':money(u)+'/tờ vật tư')+'</span></div>'+
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+MARG.map(function(m,mi){
   var o=all.filter(function(a){return a.zi===zj&&a.mi===mi})[0],win=o.ct===bc&&isFinite(bc),c=curM(),sel=zIdx()===zj&&c.l===m.l&&c.r===m.r&&c.t===m.t&&c.b===m.b;
   return '<div data-pick="'+zj+'-'+mi+'" style="cursor:pointer;background:var(--surface-1);border:'+(sel?'2px solid var(--border-accent)':'1px solid transparent')+';border-radius:var(--radius);padding:8px 10px">'+
   '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:2px">'+m.n+(win?' <span style="background:var(--bg-success);color:var(--text-success);font-size:11px;padding:1px 5px;border-radius:var(--radius)">rẻ nhất</span>':'')+'</div>'+
   '<div style="font-size:18px;font-weight:500">'+(isFinite(o.ct)?money(o.ct):'—')+'</div>'+
   '<div style="font-size:12px;color:var(--text-secondary)">'+(isFinite(o.ct)?o.sh+' tờ · '+money(o.ct/o.sh)+'/tờ · '+o.lb:'không vừa')+'</div></div>';
  }).join('')+'</div></div>';
 }).join('');
}
